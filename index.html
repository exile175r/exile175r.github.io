<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 명언 - 매일 읽는 짧고 좋은 글귀</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #666;
        }
        .links {
            margin-top: 30px;
        }
        .links a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            margin: 0 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오늘의 명언</h1>
        <p>매일매일 당신의 마음을 채워줄 짧고 좋은 글귀를 배달해 드립니다.</p>
        
        <div class="links">

    </div>

</body>
</html>
